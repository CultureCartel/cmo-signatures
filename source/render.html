<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:500;src:url(fonts/m500.woff)}
@font-face{font-family:M;font-weight:600;src:url(fonts/m600.woff)}
@font-face{font-family:M;font-weight:700;src:url(fonts/m700.woff)}
@font-face{font-family:M;font-weight:800;src:url(fonts/m800.woff)}
html,body{margin:0;background:#ddd}
canvas{display:block;background:#fff}
</style></head>
<body>
<canvas id="c"></canvas>
<script>
// ---------- engine ----------
const DPR = 2, RED = '#E1202D', INK = '#111111';
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inCubic: p => p * p * p,
  inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  outQuart: p => 1 - Math.pow(1 - p, 4),
  outQuint: p => 1 - Math.pow(1 - p, 5),
  outBack: (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2),
  outElastic: p => p === 0 || p === 1 ? p : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI / 3)) + 1,
};
const lerp = (a, b, p) => a + (b - a) * p;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, p) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], p))).join(',')})`; };

// ---------- geometry (display px) ----------
const S = 160 / 1005, OX = 8, OY = 8;
const MS = 432 * S, MX = OX + 539 * S, MY = OY, CX = MX + MS / 2, CY = MY + MS / 2, R = MS / 2;
const WX = OX, WY = OY + 267 * S;
const RULE_Y = 118.5, GC_BASE = 138.5;
const LETTER_C = { c: [94, 222.5], M: [276.5, 95.5], O: [290.5, 328] };
const SIZES = { lockup: [176, 146], banner: [560, 146], 'lockup-plain': [176, 120], 'banner-plain': [560, 120] };
let PLAIN = false;
const PEOPLE = {
  jarryd: { name: 'Jarryd McDonald', title: 'DIRECTOR, GLOBAL CIRCLE', org: 'CMO Council  ·  North America Advisory Board' },
  donovan: { name: 'Donovan Neale-May', title: 'EXECUTIVE DIRECTOR', org: 'CMO Council  ·  San Jose, USA' },
  bryan: { name: 'Bryan DeRose', title: 'SVP, BUSINESS & PROGRAM DEVELOPMENT', org: 'CMO Council  ·  cmocouncil.org' },
};
let WHO = PEOPLE.jarryd;

const IMG = {};
let GLYPHS = [], GC = [];
function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }

async function init() {
  for (const k of ['c', 'M', 'O', 'wordmark']) IMG[k] = await load('parts/' + k + '.png');
  await document.fonts.load('800 20px M'); await document.fonts.load('700 20px M');
  await document.fonts.load('600 20px M'); await document.fonts.load('500 20px M');
  // split wordmark into glyphs: find row bands, then column runs within each band
  const w = IMG.wordmark, oc = document.createElement('canvas'); oc.width = w.width; oc.height = w.height;
  const o = oc.getContext('2d'); o.drawImage(w, 0, 0); const d = o.getImageData(0, 0, w.width, w.height).data;
  const A = (x, y) => d[(y * w.width + x) * 4 + 3] > 20;
  const rows = []; let inRow = false, start = 0;
  for (let y = 0; y <= w.height; y++) {
    let any = false; if (y < w.height) for (let x = 0; x < w.width; x++) if (A(x, y)) { any = true; break; }
    if (any && !inRow) { inRow = true; start = y; } if (!any && inRow) { inRow = false; rows.push([start, y]); }
  }
  // merge tiny bands (the TM) into the nearest big band
  const big = rows.filter(r => r[1] - r[0] > 60);
  const bands = big.map(b => [...b]);
  rows.filter(r => r[1] - r[0] <= 60).forEach(r => { const b = bands.reduce((m, x) => Math.abs(x[0] - r[0]) < Math.abs(m[0] - r[0]) ? x : m); b[0] = Math.min(b[0], r[0]); b[1] = Math.max(b[1], r[1]); });
  bands.forEach((b, bi) => {
    let inC = false, cs = 0;
    for (let x = 0; x <= w.width; x++) {
      let any = false; if (x < w.width) for (let y = b[0]; y < b[1]; y++) if (A(x, y)) { any = true; break; }
      if (any && !inC) { inC = true; cs = x; } if (!any && inC) {
        inC = false;
        // tight vertical bounds for this column run
        let y0 = b[1], y1 = b[0]; for (let y = b[0]; y < b[1]; y++) for (let xx = cs; xx < x; xx++) if (A(xx, y)) { y0 = Math.min(y0, y); y1 = Math.max(y1, y + 1); break; }
        GLYPHS.push({ row: bi, x: cs, y: y0, w: x - cs, h: y1 - y0 });
      }
    }
  });
  // GLOBAL CIRCLE: fit to the width of COUNCIL (row 1 excluding the TM)
  const council = GLYPHS.filter(g => g.row === 1 && g.h > 60);
  const gx0 = WX + council[0].x * S, gx1 = WX + (council[council.length - 1].x + council[council.length - 1].w) * S;
  const ctx = document.getElementById('c').getContext('2d');
  ctx.font = '800 17.5px M'; const txt = 'GLOBAL CIRCLE';
  const widths = [...txt].map(ch => ctx.measureText(ch).width), raw = widths.reduce((a, b) => a + b, 0);
  const sp = ((gx1 - gx0) - raw) / (txt.length - 1); let x = gx0;
  GC = [...txt].map((ch, i) => { const g = { ch, x }; x += widths[i] + sp; return g; });
  GC.x0 = gx0; GC.x1 = gx1;
  return { glyphs: GLYPHS.length };
}

// ---------- drawing primitives ----------
function disc(ctx, o = {}) {
  const { a = 1, sc = 1, color = RED, r = R } = o;
  if (a <= 0 || sc <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(CX, CY, r * sc, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function letter(ctx, k, o = {}) {
  const { a = 1, dx = 0, dy = 0, sc = 1, rot = 0 } = o; if (a <= 0) return;
  const [lx, ly] = LETTER_C[k], px = MX + lx * S, py = MY + ly * S;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(px + dx, py + dy); ctx.rotate(rot); ctx.scale(sc, sc); ctx.translate(-px, -py);
  ctx.drawImage(IMG[k], MX, MY, MS, MS); ctx.restore();
}
function letters(ctx, fn) { ['c', 'M', 'O'].forEach((k, i) => letter(ctx, k, fn ? fn(i, k) : {})); }
function clipDisc(ctx, r = R) { ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.clip(); }
function glyph(ctx, g, o = {}) {
  const { a = 1, dx = 0, dy = 0, sc = 1, sx = 1, sy = 1, rot = 0, clipRow = false } = o; if (a <= 0) return;
  const x = WX + g.x * S, y = WY + g.y * S, w = g.w * S, h = g.h * S, cx = x + w / 2, cy = y + h / 2;
  ctx.save();
  if (clipRow) { ctx.beginPath(); ctx.rect(x - 4, y - 1, w + 8, h + 2); ctx.clip(); }
  ctx.globalAlpha *= a; ctx.translate(cx + dx, cy + dy); ctx.rotate(rot); ctx.scale(sc * sx, sc * sy);
  ctx.drawImage(IMG.wordmark, g.x, g.y, g.w, g.h, -w / 2, -h / 2, w, h); ctx.restore();
}
function word(ctx, fn) { GLYPHS.forEach((g, i) => glyph(ctx, g, fn ? fn(i, g) : {})); }
function gcRule(ctx, p = 1, from = 'left') {
  if (p <= 0 || PLAIN) return; ctx.save(); ctx.fillStyle = '#9a9a9a';
  const w = (GC.x1 - OX + 0) * 0 + (OX + 160 - OX) * p; // full logo width
  const x = from === 'center' ? OX + 80 - w / 2 : OX;
  ctx.fillRect(x, RULE_Y, w, 0.9); ctx.restore();
}
function gcText(ctx, fn) {
  if (PLAIN) return;
  ctx.save(); ctx.font = '800 17.5px M'; ctx.fillStyle = INK; ctx.textBaseline = 'alphabetic';
  GC.forEach((g, i) => {
    const { a = 1, dy = 0, dx = 0, clip = false } = fn ? fn(i, g) : {}; if (a <= 0) return;
    ctx.save(); if (clip) { ctx.beginPath(); ctx.rect(g.x - 2, GC_BASE - 15, 22, 19); ctx.clip(); }
    ctx.globalAlpha *= a; ctx.fillText(g.ch, g.x + dx, GC_BASE + dy); ctx.restore();
  });
  ctx.restore();
}
function fullLogo(ctx) { disc(ctx); letters(ctx); word(ctx); gcRule(ctx); gcText(ctx); }

// ---------- banner text (shared, timed per scene) ----------
const BX = 214, NAME = 'Jarryd McDonald', TITLE = 'DIRECTOR, GLOBAL CIRCLE', ORG = 'CMO Council  ·  North America Advisory Board', STRAP = '25 YEARS OF MARKETING LEADERSHIP';
function bannerText(ctx, t, t0, style = 'rise') {
  const T = x => t - t0 - x;
  // vertical rule grows from the top
  const NAME = WHO.name, TITLE = WHO.title.toUpperCase(), ORG = WHO.org;
  // shrink anything that would run past the banner edge (long names and titles from self-serve sign-ups)
  const MAXW = 560 - BX - 12;
  const fit = (font, size, min, text, spacing = 0) => { let s = size; for (; s > min; s -= .25) { ctx.font = font.replace('$', s); ctx.letterSpacing = spacing + 'px'; if (ctx.measureText(text).width <= MAXW) break; } ctx.letterSpacing = '0px'; return s; };
  const nameSize = fit('800 $px M', 25, 15, NAME);
  let tSpace = 2.2; ctx.font = '700 11px M'; ctx.letterSpacing = '2.2px'; if (ctx.measureText(TITLE).width > MAXW) tSpace = 1; ctx.letterSpacing = '1px'; if (ctx.measureText(TITLE).width > MAXW) tSpace = .5; ctx.letterSpacing = '0px';
  const titleSize = fit('700 $px M', 11, 8.5, TITLE, tSpace);
  const orgSize = fit('500 $px M', 13, 9.5, ORG);
  // baselines: plain logo ends at the COUNCIL baseline (111.5); the lockup ends at GLOBAL CIRCLE (GC_BASE)
  const Y = PLAIN ? { name: 38, title: 61, org: 84, strap: 111.5 } : { name: 66, title: 88, org: 111.5, strap: GC_BASE };
  const rp = E.inOutCubic(seg(T(0), 0, .55));
  ctx.fillStyle = RED; ctx.fillRect(194, OY, 2, (Y.strap - OY) * rp);
  // name: per-letter rise inside a mask
  ctx.save(); ctx.font = `800 ${nameSize}px M`; ctx.fillStyle = INK;
  ctx.beginPath(); ctx.rect(BX - 2, Y.name - 26, 360, 32); ctx.clip();
  let x = BX;
  [...NAME].forEach((ch, i) => {
    const p = style === 'static' ? 1 : E.outQuint(seg(T(.12 + i * .028), 0, .55));
    ctx.globalAlpha = style === 'static' ? 1 : clamp(p * 1.6);
    ctx.fillText(ch, x, Y.name + (1 - p) * 30); x += ctx.measureText(ch).width;
  });
  ctx.restore();
  // title: tracking tightens as it fades in
  ctx.save(); ctx.font = `700 ${titleSize}px M`; ctx.fillStyle = RED;
  const tp = style === 'static' ? 1 : E.outCubic(seg(T(.45), 0, .8));
  ctx.globalAlpha = tp; ctx.letterSpacing = tSpace + 'px';
  const tw = ctx.measureText(TITLE).width, squeeze = tw > MAXW ? MAXW / tw : 1; // last resort: condense very long titles
  ctx.letterSpacing = lerp(9, tSpace, tp) + 'px'; ctx.translate(BX, Y.title); ctx.scale(squeeze, 1); ctx.fillText(TITLE, 0, 0); ctx.restore();
  // org line slides in
  ctx.save(); ctx.font = `500 ${orgSize}px M`; ctx.fillStyle = '#444444';
  const op = style === 'static' ? 1 : E.outCubic(seg(T(.6), 0, .6));
  ctx.globalAlpha = op; ctx.fillText(ORG, BX - (1 - op) * 10, Y.org); ctx.restore();
  // strap: dot pops then text wipes on, sitting on the GLOBAL CIRCLE baseline
  const dp = style === 'static' ? 1 : E.outBack(seg(T(.8), 0, .35), 3);
  ctx.save(); ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(BX + 3, Y.strap - 3.6, 3 * Math.max(0, dp), 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.font = '600 9.5px M'; ctx.fillStyle = '#777777'; ctx.letterSpacing = '1.6px';
  const sp = style === 'static' ? 1 : E.inOutCubic(seg(T(.9), 0, .7));
  ctx.beginPath(); ctx.rect(BX + 10, Y.strap - 12, 330 * sp, 16); ctx.clip(); ctx.fillText(STRAP, BX + 12, Y.strap); ctx.restore();
}

// ---------- scenes ----------
const VOGEL = (n, rad) => Array.from({ length: n }, (_, k) => { const r = rad * Math.sqrt((k + .5) / n), th = k * 2.399963; return [CX + r * Math.cos(th), CY + r * Math.sin(th)]; });
const markIn = (t, t0, gap = .08) => (i) => { const p = seg(t, t0 + i * gap, t0 + .45 + i * gap); return { a: clamp(p * 2), sc: lerp(.6, 1, E.outBack(p, 2.2)) }; };
const wordRise = (t, t0, gap = .04, dist = 9) => (i) => { const p = E.outCubic(seg(t, t0 + i * gap, t0 + .5 + i * gap)); return { a: p, dy: (1 - p) * dist }; };
const gcIn = (t, t0) => { return [E.inOutCubic(seg(t, t0, t0 + .5)), (i) => { const p = E.outCubic(seg(t, t0 + .1 + i * .03, t0 + .4 + i * .03)); return { a: p, dy: (1 - p) * 5, clip: true }; }]; };

const SCENES = [
  { key: 'convergence', name: 'Convergence', T: 6, text: 2.0,
    blurb: '320 red points sweep in from every direction and lock into the disc. The network becomes the mark.',
    setup() { const r = rng(7); this.pts = VOGEL(320, R * .97).map(([tx, ty]) => { const a = r() * Math.PI * 2, d = 70 + r() * 120; return { tx, ty, sx: CX + Math.cos(a) * d, sy: CY + Math.sin(a) * d * .75, delay: r() * .55 }; }); },
    draw(ctx, t) {
      const fade = 1 - seg(t, 1.75, 2.1);
      if (fade > 0) { ctx.fillStyle = RED; this.pts.forEach(q => {
        const p = E.inOutCubic(seg(t, .1 + q.delay, 1.25 + q.delay)), sw = (1 - p) * 1.5;
        let x = lerp(q.sx, q.tx, p) - CX, y = lerp(q.sy, q.ty, p) - CY; const c = Math.cos(sw), s = Math.sin(sw);
        ctx.globalAlpha = clamp(seg(t, q.delay, q.delay + .25)) * fade;
        ctx.beginPath(); ctx.arc(CX + x * c - y * s, CY + x * s + y * c, 1.25 + p * .5, 0, 7); ctx.fill(); }); ctx.globalAlpha = 1; }
      disc(ctx, { a: E.outCubic(seg(t, 1.55, 2.0)) });
      letters(ctx, markIn(t, 1.9)); word(ctx, wordRise(t, 1.5)); const [rp, gf] = gcIn(t, 2.05); gcRule(ctx, rp); gcText(ctx, gf);
    } },
  { key: 'globe', name: 'Globe to Mark', T: 6, text: 1.1,
    blurb: 'A dotted globe spins, its points flush red and swell until the world becomes the CMO Council disc.',
    setup() { const n = 240; this.pts = Array.from({ length: n }, (_, i) => { const y = 1 - (i / (n - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963; return [Math.cos(th) * r, y, Math.sin(th) * r, (i * 7919) % 9 === 0]; }); },
    draw(ctx, t) {
      const m = E.inOutCubic(seg(t, 1.25, 2.05)), app = E.outBack(seg(t, 0, .5), 1.4), rot = 1.1 + (t < 2.2 ? t : 2.2) * 2.4 - m * .4, tilt = -.38;
      const dotsA = 1 - seg(t, 2.0, 2.3);
      if (dotsA > 0) {
        const pr = this.pts.map(([x, y, z, red]) => { const x1 = x * Math.cos(rot) - z * Math.sin(rot), z1 = x * Math.sin(rot) + z * Math.cos(rot); const y2 = y * Math.cos(tilt) - z1 * Math.sin(tilt), z2 = y * Math.sin(tilt) + z1 * Math.cos(tilt); return [x1, y2, z2, red]; }).sort((a, b) => a[2] - b[2]);
        pr.forEach(([x, y, z, red]) => { const d = (z + 1) / 2, rr = R * .96 * app;
          ctx.globalAlpha = (0.18 + .82 * d) * lerp(1, 1, m) * dotsA * clamp(app);
          ctx.fillStyle = red ? RED : mix('#8a8a8a', RED, m);
          ctx.beginPath(); ctx.arc(CX + x * rr, CY + y * rr, (0.55 + d * .9) * (1 - m) + m * 3.4 * (0.6 + d * .4), 0, 7); ctx.fill(); });
        ctx.globalAlpha = 1;
      }
      disc(ctx, { a: E.outCubic(seg(t, 1.8, 2.15)) });
      letters(ctx, markIn(t, 2.05)); word(ctx, wordRise(t, .35)); const [rp, gf] = gcIn(t, .8); gcRule(ctx, rp); gcText(ctx, gf);
    } },
  { key: 'liquid', name: 'Liquid Fill', T: 6, text: 1.6,
    blurb: 'An outline draws, then red rises inside it like liquid, surfacing the letters as the wave settles.',
    setup() { const r = rng(3); this.bub = Array.from({ length: 9 }, () => ({ x: CX + (r() - .5) * R * 1.3, t0: .6 + r() * 1.1, sp: 20 + r() * 25, rr: .8 + r() * 1.4 })); },
    draw(ctx, t) {
      const op = E.inOutCubic(seg(t, 0, .7)), oa = 1 - seg(t, 1.9, 2.3);
      if (oa > 0 && op > 0) { ctx.save(); ctx.globalAlpha = oa; ctx.strokeStyle = RED; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(CX, CY, R - .6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * op); ctx.stroke(); ctx.restore(); }
      const lv = E.inOutCubic(seg(t, .45, 2.05)), level = CY + R + 4 - lv * (2 * R + 12), A = 3.4 * (1 - seg(t, 1.5, 2.5));
      const path = () => { ctx.beginPath(); ctx.moveTo(CX - R - 2, CY + R + 2); for (let x = CX - R - 2; x <= CX + R + 2; x += 1) ctx.lineTo(x, level + A * Math.sin(x * .17 + t * 7.5) + A * .45 * Math.sin(x * .29 - t * 5)); ctx.lineTo(CX + R + 2, CY + R + 2); ctx.closePath(); };
      ctx.save(); clipDisc(ctx); path(); ctx.fillStyle = RED; ctx.fill(); path(); ctx.clip(); letters(ctx);
      ctx.fillStyle = '#ffffff'; this.bub.forEach(b => { const age = t - b.t0; if (age < 0 || age > 1.2) return; ctx.globalAlpha = .55 * (1 - age / 1.2); ctx.beginPath(); ctx.arc(b.x + Math.sin(age * 9) * 1.5, CY + R - age * b.sp, b.rr, 0, 7); ctx.fill(); });
      ctx.restore();
      word(ctx, (i) => { const p = seg(t, 1.25 + i * .05, 1.85 + i * .05); return { a: clamp(p * 2), dy: (1 - E.outBack(p, 2.4)) * 11 }; });
      const [rp, gf] = gcIn(t, 1.85); gcRule(ctx, rp, 'center'); gcText(ctx, gf);
    } },
  { key: 'ink', name: 'Ink & Slide', T: 6, text: 1.55,
    blurb: 'A pen traces the circle, ink floods it, and c, M, O slide into the frame from three directions.',
    draw(ctx, t) {
      const ap = E.inOutCubic(seg(t, .05, .95)), a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * ap, fa = 1 - seg(t, 1.2, 1.4);
      if (ap > 0 && fa > 0) { ctx.save(); ctx.globalAlpha = fa; ctx.strokeStyle = RED; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(CX, CY, R - 1.3, a0, a1); ctx.stroke();
        ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(CX + Math.cos(a1) * (R - 1.3), CY + Math.sin(a1) * (R - 1.3), 2.6 * (1 - seg(t, .9, 1.05)), 0, 7); ctx.fill(); ctx.restore(); }
      disc(ctx, { sc: E.outBack(seg(t, .9, 1.35), 1.2) });
      ctx.save(); clipDisc(ctx);
      const sl = (a, b) => 1 - E.outQuart(seg(t, a, b));
      letter(ctx, 'c', { dx: -R * 1.6 * sl(1.2, 1.75) }); letter(ctx, 'M', { dy: -R * 1.6 * sl(1.3, 1.85) }); letter(ctx, 'O', { dy: R * 1.6 * sl(1.4, 1.95) });
      ctx.restore();
      word(ctx, (i) => { const p = seg(t, 1.0 + i * .045, 1.5 + i * .045); return { a: clamp(p * 2.5), dy: -(1 - E.outBack(p, 2)) * 12, rot: (1 - p) * .25 }; });
      gcRule(ctx, E.inOutCubic(seg(t, 1.65, 2.15))); gcText(ctx, (i) => ({ a: t > 1.8 + i * .04 ? 1 : 0 }));
    } },
  { key: 'twentyfive', name: '25 Years', T: 7, text: .9,
    blurb: 'The disc counts up from 01 to 25 for the Council’s anniversary, then the numerals hand off to c, M, O.',
    draw(ctx, t) {
      disc(ctx, { sc: E.outBack(seg(t, 0, .45), 2) });
      const v = 1 + 24 * E.outCubic(seg(t, .35, 2.1)), n = Math.min(25, Math.floor(v)), fr = n >= 25 ? 0 : v - n;
      const out = E.inCubic(seg(t, 2.3, 2.7)) * R * 1.7;
      ctx.save(); clipDisc(ctx); ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.font = '800 31px M';
      const tw = ctx.measureText('0').width, by = CY + 8 - out;
      ctx.fillText(String(Math.floor(n / 10)), CX - tw / 2 - .5, by + (n % 10 === 9 ? fr * 0 : 0));
      ctx.save(); ctx.beginPath(); ctx.rect(CX - R, by - 24, 2 * R, 27); ctx.clip();
      ctx.fillText(String(n % 10), CX + tw / 2 + .5, by - fr * 27); if (fr > 0) ctx.fillText(String((n + 1) % 10), CX + tw / 2 + .5, by + (1 - fr) * 27); ctx.restore();
      ctx.font = '700 6.2px M'; ctx.letterSpacing = '1.6px'; ctx.globalAlpha = seg(t, .5, .9); ctx.fillText('YEARS', CX + .8, CY + 19 - out);
      ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
      letters(ctx, (i) => ({ dy: R * 2.4 * (1 - E.outQuart(seg(t, 2.45 + i * .08, 2.95 + i * .08))) }));
      ctx.restore();
      word(ctx, wordRise(t, .2)); const [rp, gf] = gcIn(t, .6); gcRule(ctx, rp); gcText(ctx, gf);
    } },
  { key: 'orbits', name: 'Orbit System', T: 4, text: null,
    blurb: 'Three satellites trace tilted orbits around the mark, passing behind and in front. Never stops moving.',
    draw(ctx, t) {
      const O = [[-.42, 44, 11.5, 1, 0], [.36, 41, 10, -1, .35], [1.12, 37, 11, 2, .7]];
      const pt = (o, ph) => { const [th, rx, ry] = o, x = rx * Math.cos(ph), y = ry * Math.sin(ph); return [CX + x * Math.cos(th) - y * Math.sin(th), CY + x * Math.sin(th) + y * Math.cos(th), Math.sin(ph)]; };
      const half = (front) => O.forEach(o => {

  { key: 'iris', name: 'Aperture', T: 6, text: 1.3,
    blurb: 'A camera iris closes over the mark, then opens to reveal it. The wordmark slides up through masks.',

      const app = E.outBack(seg(t, 0, .35), 1.5), op = E.inOutCubic(seg(t, .35, 1.3)), a = R * 1.3 * op, rho = 1.1 * (1 - op);

        const N = 7, V = Array.from({ length: N }, (_, k) => { const an = rho + k * Math.PI * 2 / N; return [CX + Math.cos(an) * a, CY + Math.sin(an) * a]; });

        ctx.restore(); }
      word(ctx, (i, g) => { const p = E.outQuart(seg(t, 1.0 + g.row * .14 + i * .015, 1.55 + g.row * .14 + i * .015)); return { dy: (1 - p) * (g.h * S + 4), clipRow: true }; });
      gcRule(ctx, E.inOutCubic(seg(t, 1.35, 1.85))); gcText(ctx, (i) => { const p = E.outQuart(seg(t, 1.45 + i * .02, 1.9 + i * .02)); return { dy: (1 - p) * 19, clip: true }; });
    } },
  { key: 'kinetic', name: 'Kinetic Roll', T: 6, text: 1.5,
    blurb: 'C, M, O slam down from huge scale, COUNCIL whips in, and the disc rolls on like a wheel and lands.',
    draw(ctx, t) {
      const rollP = E.outCubic(seg(t, .95, 1.75)), off = (1 - rollP) * 150;
      const squash = t > 1.7 ? 1 - .07 * Math.sin(seg(t, 1.7, 1.95) * Math.PI) : 1;
      for (let k = 3; k >= 0; k--) { const tt = t - k * .035, rp = E.outCubic(seg(tt, .95, 1.75)), of = (1 - rp) * 150; if (k && (rp >= 1 || rp <= 0)) continue;
        ctx.save(); ctx.globalAlpha = k ? .12 : 1; ctx.translate(CX + of, CY + (MS / 2) * (1 - (k ? 1 : squash))); ctx.scale(k ? 1 : 1 / squash, k ? 1 : squash); ctx.rotate(-of / R); ctx.translate(-CX, -CY);
        disc(ctx); letters(ctx); ctx.restore(); }
      let j = 0; word(ctx, (i, g) => {
        if (g.row === 0) { const p = seg(t, .08 + i * .17, .38 + i * .17); const sc = lerp(3.4, 1, E.inCubic(p)); const bump = p >= 1 ? 1 + .06 * Math.sin(seg(t, .38 + i * .17, .55 + i * .17) * Math.PI) : 1; return { a: clamp(p * 3), sc: sc * bump }; }
        j++; const p = seg(t, .55 + j * .05, 1.0 + j * .05); return { a: clamp(p * 3), dx: (1 - E.outBack(p, 1.6)) * 46 };
      });
      const [rp, gf] = gcIn(t, 1.6); gcRule(ctx, rp); gcText(ctx, gf);
    } },
  { key: 'network', name: 'Signal Network', T: 6, text: 1.8,
    blurb: 'A radar sweep pings out from the disc and lights up a web of nodes, then pulls it all back into the logo.',
    setup() { const r = rng(11); this.nodes = Array.from({ length: 12 }, (_, k) => { const an = -Math.PI * .95 + k * (Math.PI * 1.9 / 11) + (r() - .5) * .25 + (k % 2 ? 0 : .1), d = 48 + r() * 58; let x = CX + Math.cos(an) * d * 1.25, y = CY + Math.sin(an) * d * .9; x = clamp(x, 8, 170); y = clamp(y, 6, 112); return { x, y, t0: .3 + k * .07 }; }); },
    draw(ctx, t) {
      const env = seg(t, 0, .3) * (1 - seg(t, 1.55, 1.95));
      if (env > 0) { ctx.save(); const g = ctx.createConicGradient(t * 4.2, CX, CY); g.addColorStop(0, 'rgba(225,32,45,.28)'); g.addColorStop(.12, 'rgba(225,32,45,0)'); g.addColorStop(1, 'rgba(225,32,45,0)');
        ctx.globalAlpha = env; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, 130, 0, 7); ctx.fill(); ctx.restore(); }
      const net = 1 - seg(t, 1.7, 2.2);
      if (net > 0) this.nodes.forEach(n => { const lp = E.outCubic(seg(t, n.t0, n.t0 + .4)), an = Math.atan2(n.y - CY, n.x - CX), ex = CX + Math.cos(an) * R, ey = CY + Math.sin(an) * R;
        ctx.save(); ctx.globalAlpha = net * .5; ctx.strokeStyle = RED; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(lerp(ex, n.x, lp), lerp(ey, n.y, lp)); ctx.stroke();
        const np = E.outBack(seg(t, n.t0 + .3, n.t0 + .6), 3); ctx.globalAlpha = net; ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(n.x, n.y, 2.3 * Math.max(0, np), 0, 7); ctx.fill();
        const pp = seg(t, n.t0 + .35, n.t0 + 1.0); if (pp > 0 && pp < 1) { ctx.globalAlpha = net * (1 - pp) * .6; ctx.strokeStyle = RED; ctx.beginPath(); ctx.arc(n.x, n.y, 2 + pp * 7, 0, 7); ctx.stroke(); }
        ctx.restore(); });
      disc(ctx, { sc: E.outBack(seg(t, 0, .4), 2) }); letters(ctx, markIn(t, .2));
      word(ctx, wordRise(t, 1.65, .035)); const [rp, gf] = gcIn(t, 2.0); gcRule(ctx, rp); gcText(ctx, gf);
    } },
  { key: 'coin', name: 'Gold Standard', T: 6, text: 1.3,
    blurb: 'The disc spins in like a minted coin with a real rim and specular light, then a gloss pass crosses the logo.',
    draw(ctx, t) {
      const p = E.outCubic(seg(t, 0, 1.5)), th = Math.PI * 3 * (1 - p), c = Math.cos(th), front = c >= 0, k = Math.max(Math.abs(c), .015);
      const rim = Math.abs(Math.sin(th)) * 3.2;
      const s0 = lerp(.82, 1, E.outCubic(seg(t, 0, .45)));
      ctx.save(); ctx.translate(CX, CY); ctx.scale(s0, s0);
      if (rim > .2) { ctx.save(); ctx.scale(k, 1); ctx.fillStyle = '#9e1119'; ctx.beginPath(); ctx.arc(rim / k * (front ? -1 : 1) * .5, 0, R, 0, 7); ctx.fill(); ctx.restore(); }
      ctx.scale(k, 1); ctx.translate(-CX, -CY);
      disc(ctx, { color: front ? RED : '#c41824' });
      if (front) letters(ctx);
      ctx.save(); clipDisc(ctx); const hx = CX + Math.sin(th) * R * 1.2, g = ctx.createRadialGradient(hx, CY - R * .3, 0, hx, CY - R * .3, R * 1.1);
      g.addColorStop(0, `rgba(255,255,255,${.55 * Math.abs(Math.sin(th)) * (1 - p * .4)})`); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(CX - R, CY - R, 2 * R, 2 * R); ctx.restore();
      ctx.restore();
      word(ctx, (i) => { const q = seg(t, .35 + i * .05, .8 + i * .05); return { a: clamp(q * 3), sy: Math.max(.01, E.outBack(q, 2)) }; });
      const [rp, gf] = gcIn(t, 1.0); gcRule(ctx, rp); gcText(ctx, gf);
      // gloss pass over everything drawn so far
      const gp = seg(t, 1.6, 2.35); this._gloss = gp > 0 && gp < 1;
    } },
];

// ---------- frame API ----------
let ready = init();
async function frame(si, variant, t, who = 'jarryd') {
  await ready; PLAIN = variant.endsWith('-plain'); WHO = typeof who === 'string' ? PEOPLE[who] : who; const sc = SCENES[si], [W, H] = SIZES[variant], cv = document.getElementById('c');
  if (cv.width !== W * DPR || cv.height !== H * DPR) { cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; }
  if (sc.setup && !sc._s) { sc.setup(); sc._s = 1; }
  const ctx = cv.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // logo layer drawn on a transparent layer so the gloss only touches ink, then composited on white
  const L = sc._layer || (sc._layer = document.createElement('canvas')); L.width = cv.width; L.height = cv.height;
  const lc = L.getContext('2d'); lc.setTransform(DPR, 0, 0, DPR, 0, 0); lc.clearRect(0, 0, W, H);
  sc.draw(lc, t);
  if (variant.startsWith('banner')) bannerText(lc, t, sc.text ?? 0, sc.text == null ? 'static' : 'rise');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(L, 0, 0);
  if (sc._gloss) { // recompute gloss on the transparent logo layer so it never paints the background
    const o = document.createElement('canvas'); o.width = L.width; o.height = L.height; const oc = o.getContext('2d'); oc.drawImage(L, 0, 0);
    oc.globalCompositeOperation = 'source-atop'; const gp = seg(t, 1.6, 2.35), x = lerp(-60, variant.startsWith('banner') ? 620 : 240, E.inOutCubic(gp)) * DPR;
    const gr = oc.createLinearGradient(x - 40 * DPR, 0, x + 40 * DPR, 30 * DPR); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(255,255,255,.8)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    oc.fillStyle = gr; oc.fillRect(0, 0, o.width, o.height); ctx.drawImage(o, 0, 0);
  }
  return cv.toDataURL('image/png');
}
// circular headshot on a solid background, or an initials badge when there is no photo
async function avatar(src, bg, initials, size = 192) {
  await ready; const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, size, size);
  x.save(); x.beginPath(); x.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); x.clip();
  if (src) { const im = await load(src); const s = Math.min(im.width, im.height); x.drawImage(im, (im.width - s) / 2, (im.height - s) * .35, s, s, 0, 0, size, size); }
  else { x.fillStyle = RED; x.fillRect(0, 0, size, size); x.fillStyle = '#ffffff'; x.font = `800 ${size * .38}px M`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(initials, size / 2, size / 2 + size * .02); }
  x.restore(); return c.toDataURL('image/png');
}
window.SCENES = SCENES; window.frame = frame; window.ready = ready; window.avatar = avatar;
// preview: ?s=0&v=lockup&t=5
const q = new URLSearchParams(location.search); if (q.has('s')) frame(+q.get('s'), q.get('v') || 'lockup', +(q.get('t') || 5));
